# Build reproducible de recurretumulta.online.
# Publicar SOLO con `npm run publish:check` en verde (ver README).
[build]
  command = "npm run build:full"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # VITE_CONVEX_URL y VITE_ADSENSE_* se definen en Netlify > Site settings > Environment.
# Cabeceras y redirecciones: public/_headers y public/_redirects (se copian a dist/).
